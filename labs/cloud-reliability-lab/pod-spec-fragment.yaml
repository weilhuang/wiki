terminationGracePeriodSeconds: 30
containers:
  - name: orders
    ports:
      - name: http
        containerPort: 8080
    startupProbe:
      httpGet:
        path: /startupz
        port: http
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 1
      successThreshold: 1
    livenessProbe:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 5"]
